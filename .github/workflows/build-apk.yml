name: Build APK

on:
  push:
    branches: [main]
    paths: ['mobile/**', '.github/workflows/build-apk.yml']
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Aceitar licencas do Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Gerar projeto Android (Capacitor)
        working-directory: mobile
        run: |
          npm install
          npx cap add android
          npx cap sync android

      - name: Compilar APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: Salao-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
